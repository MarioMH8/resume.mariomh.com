name: Continuous integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        command: [lint:ci, typecheck, typecheck:astro, test, check:packages]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mariomh8'

      - name: Export GitHub Packages token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "NODE_AUTH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint cache
        uses: actions/cache@v6
        if: matrix.command == 'lint:ci'
        with:
          path: .eslintcache
          key: ${{ runner.os }}-${{ matrix.command }}

      - name: ${{ matrix.command }}
        run: bun run ${{ matrix.command }}

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mariomh8'

      - name: Export GitHub Packages token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "NODE_AUTH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Create Release Pull Request or Publish to registry
        uses: changesets/action@v2.1.2
        with:
          publish-script: bun changeset publish
          version-script: bun changeset version
          commit-message: 'chore: release'
          pr-title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
