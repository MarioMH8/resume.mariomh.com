name: Deploy

on:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        command: [lint:ci, test, typecheck, typecheck:astro]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mariomh8'

      - name: Export GitHub Packages token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "NODE_AUTH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint cache
        uses: actions/cache@v6
        if: matrix.command == 'lint:ci'
        with:
          path: .eslintcache
          key: ${{ runner.os }}-${{ matrix.command }}

      - name: ${{ matrix.command }}
        run: bun run ${{ matrix.command }}

  release:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mariomh8'

      - name: Export GitHub Packages token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "NODE_AUTH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=resume-mariomh
